services:
  mentio-db:
    image: pgvector/pgvector:pg16
    container_name: mentio-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentio_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - mentio_pgdata:/var/lib/postgresql/data

volumes:
  mentio_pgdata: